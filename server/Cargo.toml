[package]
name = "taskhit-server"
version = "0.6.0"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "TaskHit: calendario scolastico condiviso, server leggero"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", default-features = false, features = ["backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["limit", "timeout", "trace", "fs", "set-header", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[features]
# Di default SQLite incluso (non cifrato su disco). In produzione si compila con --features sqlcipher.
default = ["sqlite-bundled"]
sqlite-bundled = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
