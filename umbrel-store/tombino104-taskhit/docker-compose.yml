version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-taskhit_web_1
      APP_PORT: 8080
      # TaskHit ha il proprio accesso (i compagni entrano dal tunnel senza account Umbrel).
      PROXY_AUTH_ADD: "false"

  web:
    # Dopo il primo push dell'immagine sostituisci con il riferimento fissato: ghcr.io/tombino104/taskhit:0.1.0@sha256:<digest>
    image: ghcr.io/tombino104/taskhit:0.1.0
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TASKHIT_DATA_DIR: /data
      TASKHIT_COOKIE_SECURE: "true"
      # TASKHIT_PUBLIC_URL: "https://taskhit-tombino104.net"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
