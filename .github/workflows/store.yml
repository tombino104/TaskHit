# Quando l'immagine di una versione è pronta, avvia subito l'aggiornamento dello store Umbrel.
# Serve il segreto STORE_TOKEN: un token limitato a tombino104-store con il solo permesso
# «Actions: read and write». Senza, lo store si aggiorna col suo giro programmato.
name: store
on:
  workflow_run:
    workflows: [immagine-docker]
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  avvisa:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Avvia l'aggiornamento dello store
        env:
          GH_TOKEN: ${{ secrets.STORE_TOKEN }}
          STORE: ${{ github.repository_owner }}/tombino104-store
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Manca il segreto STORE_TOKEN: lo store non è stato avvisato."
            exit 0
          fi
          gh workflow run update-apps.yml --repo "$STORE" --ref main
          echo "Aggiornamento dello store avviato."
